# Tessera — Python project configuration.
# Managed by uv. The toolchain (ruff, mypy, pytest) is configured here so that
# the /verify gate and CI run the exact same checks from one source of truth.

[project]
name = "tessera"
version = "0.0.0"
description = "A trust layer for enterprise AI agents — grounded answers with claim-level provenance and measured faithfulness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
# The front door: BYO subcommands (connect/ask/smoke/ingest, Milestone 18)
# dispatch to their paths; anything else falls through to the business demo
# door unchanged (spec 0117 decision 5).
tessera = "tessera.cli:main"
tessera-chat = "tessera.surface.cli:main"
tessera-eval = "tessera.eval.cli:main"
tessera-benchmark = "tessera.eval.benchmark:main"
tessera-compose = "tessera.business.composition:main"
tessera-devex = "tessera.devex.cli:main"
tessera-mcp = "tessera.agent.mcp_server:main"
tessera-ui = "tessera.ui.server:main"

[project.optional-dependencies]
# SAP HANA Cloud driver — the only non-stdlib runtime dependency, and it is
# OPT-IN: `uv sync --extra cloud`. Imported lazily by the HANA vector backend
# (ADR 0015); the default clone-and-run graph never touches it (guarded by
# tests/test_vectors.py::test_default_import_graph_has_no_hdbcli).
cloud = ["hdbcli>=2.19"]
# Parquet reader for the real SAP SALT dataset — OPT-IN: `uv sync --extra salt`.
# Imported only by scripts/salt_real_slice.py (the gated-data slice extractor,
# spec 0130); the ingester (tessera/sources/salt_real.py) and CI never touch it.
salt = ["pyarrow>=17"]
# Model Context Protocol server SDK — OPT-IN: `uv sync --extra agent`. Imported
# lazily only by tessera.agent.mcp_server's build_server()/main(); the default
# clone-and-run graph and CI never touch it (guarded by
# tests/test_agent.py and tests/test_mcp_server.py). The grounded-tool
# substance (tessera.agent.grounded) carries no MCP dependency (ADR 0022).
agent = ["mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

# Dev tooling (PEP 735 dependency group). Installed via `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.10",
    "mypy>=1.15",
    "pytest>=8.0",
    "pre-commit>=4.0",
]
# Docs site toolchain. Not installed by default; CI and local docs builds opt in
# with `uv sync --group docs` / `uv run --group docs mkdocs ...`.
docs = [
    "mkdocs-material>=9.5",
]

# --- Ruff: linting + formatting in one tool ---------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# A sensible, non-noisy default set. Expand deliberately, not for its own sake.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

# --- mypy: strict static typing ---------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The optional HANA driver ships no type stubs; it is imported lazily and only
# under the 'cloud' extra (ADR 0015), so its absence must not fail the gate.
module = ["hdbcli.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The optional MCP server SDK is imported lazily and only under the 'agent' extra
# (ADR 0022); CI runs the base graph without it, so its absence must not fail the
# gate (mirrors the hdbcli override; the wiring is contract-tested where installed).
module = ["mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The MCP server's tool decorators are FastMCP's. Under the base graph (no 'agent'
# extra) the SDK is Any (ignore_missing_imports above), which makes those decorators
# "untyped" under strict mode; the thin wiring is contract-tested where the SDK is
# installed, so this strict check is relaxed for this module only.
module = ["tessera.agent.mcp_server"]
disallow_untyped_decorators = false

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
