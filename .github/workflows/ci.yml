# CI — the remote half of the "nothing unverified" guarantee. Mirrors the local
# /verify gate (format, lint, types, tests) plus a gitleaks secret scan, run
# against the locked environment so CI and a fresh clone resolve identically.
#
# Once this is green on GitHub, enable branch protection on `main` requiring the
# "gate" check (docs/SETUP.md A3) — a manual repo setting, not done here.
#
# Action `uses:` are pinned to commit SHAs (with version comments) for
# supply-chain hygiene; dependabot keeps them current.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref so only the latest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # --frozen fails the build if uv.lock has drifted from pyproject.toml.
      - name: Install dependencies
        run: uv sync --frozen

      # The independent JavaScript verifier (spec 0148) runs inside the gate's
      # test suite: a cross-implementation disagreement must fail the build
      # like any other red test. Node >= 21 is required for JSON source-text
      # access (ADR 0031 addendum).
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      # Format, lint, type-check, tests — via the shared gate script that the
      # local /verify command also runs, so the two can never disagree.
      - name: Gate (format, lint, type-check, tests)
        run: bash scripts/gate.sh

      # Reuse the pinned gitleaks hook from .pre-commit-config.yaml (single
      # source of truth) so secrets are caught even if a contributor skipped
      # `pre-commit install`.
      - name: Cache pre-commit environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Secret scan
        run: uv run pre-commit run gitleaks --all-files

  # The bundle-determinism matrix (spec 0137): trust bundles must emit
  # byte-identically and re-derive to the same verdicts on every platform a
  # stranger might run `tessera verify` on — one spurious mismatch on someone's
  # laptop would sink the whole re-execution claim. Scoped to the bundle test
  # subset so it stays fast; the full gate above stays a single ubuntu job.
  bundle-matrix:
    name: bundle-determinism (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python }}

      # Byte-identical emission + 100% re-derivation across OS/Python: the
      # bundle, benchmark-adjacent, and Auditability-Floor test subset.
      - name: Bundle determinism
        run: >
          uv run pytest -q
          tests/test_bundle_serde.py
          tests/test_bundle_format.py
          tests/test_bundle_verify.py
          tests/test_bundle_signing.py
          tests/test_bundle_action.py
          tests/test_bundle_chain.py
          tests/test_bundle_policy.py
          tests/test_bundle_approval.py
          tests/test_conformance.py
          tests/test_proof.py
          tests/test_auditability.py
