# Docs site — build the MkDocs Material site on every PR (so breakage is
# visible) and deploy it to GitHub Pages on push to main.
#
# One-time manual step: in repo Settings → Pages, set the source to
# "GitHub Actions" (docs/SETUP.md). Until then the deploy job will fail
# harmlessly — it is not the required `gate` check, so it never blocks PRs.
#
# Action `uses:` are pinned to commit SHAs (dependabot keeps them current).

name: Docs

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the deploy job elevates only what it needs.
permissions:
  contents: read

# Allow one concurrent Pages deployment; do not cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --frozen --group docs

      # strict mode is set in mkdocs.yml, so a broken link or missing nav fails.
      - name: Build site
        run: uv run --group docs mkdocs build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    # Deploy only the live site, only after a successful build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
