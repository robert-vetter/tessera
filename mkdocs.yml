# MkDocs Material configuration for the Tessera docs site.
# Build:  uv run --group docs mkdocs build      (strict — see `strict` below)
# Serve:  uv run --group docs mkdocs serve
# Published to GitHub Pages by .github/workflows/docs.yml on push to main.

site_name: Tessera
site_description: A trust layer for enterprise AI agents — grounded answers with claim-level provenance and measured faithfulness.
repo_url: https://github.com/robert-vetter/tessera
repo_name: robert-vetter/tessera

# Treat build warnings (broken links, pages missing from nav) as errors, so the
# docs site can never quietly rot.
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Project Brief: PROJECT_BRIEF.md
  - Capabilities: CAPABILITIES.md
  - Roadmap: ROADMAP.md
  - SAP Alignment: SAP_ALIGNMENT.md
  - Engineering: ENGINEERING.md
  - Setup: SETUP.md
  - Status: STATUS.md
  - Architecture Decisions:
      - Overview: adr/README.md
      - 0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
      - 0002 Ingestion & provenance representation: adr/0002-ingestion-provenance-representation.md
      - 0003 Lexical-first retrieval: adr/0003-lexical-first-retrieval.md
      - 0004 Graph & entity resolution: adr/0004-graph-and-entity-resolution.md
      - 0005 Faithfulness metric: adr/0005-faithfulness-metric.md
      - 0006 Deterministic reasoning, LLM deferred: adr/0006-deterministic-reasoning-llm-deferral.md
      - 0007 Synthetic scenario generation: adr/0007-synthetic-scenario-generation.md
      - 0008 The core/vertical boundary: adr/0008-vertical-boundary.md
      - 0009 Multi-vertical eval batteries: adr/0009-multi-vertical-eval-batteries.md
      - 0010 Declared aliases before embeddings: adr/0010-declared-aliases-before-embeddings.md

# The ADR template is intentionally not a published page.
not_in_nav: |
  adr/0000-template.md
